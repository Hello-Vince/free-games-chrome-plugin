<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Free Games Tracker promo tile</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        padding: 34px;
        align-items: center;
        background:
          radial-gradient(circle at 100% 0%, #99f6e4 0%, transparent 43%),
          linear-gradient(140deg, #f4fbfa, #e7f1f1);
        color: #172126;
      }
      body::after {
        position: absolute;
        width: 170px;
        height: 170px;
        right: -78px;
        bottom: -86px;
        border-radius: 999px;
        background: #0f766e;
        content: "";
        opacity: 0.88;
      }
      main { position: relative; z-index: 1; max-width: 330px; }
      img { width: 66px; height: 66px; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 30px; line-height: 1.05; letter-spacing: -1px; }
      p { margin: 10px 0 0; color: #506066; font-size: 16px; font-weight: 560; line-height: 1.35; }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/icon-128.png" alt="">
      <h1>Free Games Tracker</h1>
      <p>Catch active giveaways before they’re gone.</p>
    </main>
  </body>
</html>
