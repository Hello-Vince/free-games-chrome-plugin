<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Free Games Tracker store screenshot</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172126;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 520px;
        gap: 72px;
        align-items: center;
        padding: 70px 88px;
        background:
          radial-gradient(circle at 88% 8%, rgba(204, 251, 241, 0.92), transparent 34%),
          linear-gradient(135deg, #f4faf9 0%, #eef4f5 52%, #e8f1f1 100%);
      }

      body::before,
      body::after {
        position: absolute;
        border-radius: 999px;
        content: "";
        opacity: 0.52;
      }

      body::before {
        width: 320px;
        height: 320px;
        right: -105px;
        bottom: -130px;
        background: #0f766e;
      }

      body::after {
        width: 150px;
        height: 150px;
        top: -65px;
        left: 430px;
        border: 34px solid #99f6e4;
      }

      .copy { position: relative; z-index: 1; }

      .brand {
        display: flex;
        margin-bottom: 46px;
        align-items: center;
        gap: 14px;
        font-size: 19px;
        font-weight: 820;
      }

      .brand img { width: 58px; height: 58px; }

      .eyebrow {
        margin: 0 0 14px;
        color: #0f766e;
        font-size: 15px;
        font-weight: 850;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      h1 {
        max-width: 590px;
        margin: 0;
        font-size: 58px;
        line-height: 1.04;
        letter-spacing: -2.6px;
      }

      .lede {
        max-width: 560px;
        margin: 24px 0 0;
        color: #4d5d63;
        font-size: 22px;
        line-height: 1.48;
      }

      .feature-row {
        display: flex;
        margin-top: 34px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .feature-row span {
        padding: 9px 13px;
        border: 1px solid #cddedd;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #31524f;
        font-size: 14px;
        font-weight: 760;
      }

      .popup-frame {
        position: relative;
        z-index: 1;
        width: 440px;
        height: 660px;
        padding: 20px;
        border: 1px solid rgba(134, 159, 159, 0.4);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.58);
        box-shadow: 0 32px 70px rgba(24, 56, 54, 0.2);
        backdrop-filter: blur(12px);
      }

      iframe {
        width: 400px;
        height: 620px;
        border: 0;
        border-radius: 15px;
        background: #f5f7f8;
      }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand">
        <img src="assets/icon-128.png" alt="">
        <span>Free Games Tracker</span>
      </div>
      <p class="eyebrow" id="eyebrow">Active giveaways</p>
      <h1 id="headline">Free games, easy to spot.</h1>
      <p class="lede" id="lede">Browse current giveaways, see what’s new, and jump to the offer while it’s still active.</p>
      <div class="feature-row" id="features" aria-label="Features">
        <span>Live GamerPower feed</span>
        <span>Unseen-offer badge</span>
        <span>Local history</span>
      </div>
    </section>
    <div class="popup-frame">
      <iframe id="popup" title="Free Games Tracker popup preview"></iframe>
    </div>
    <script>
      const modes = {
        feed: {
          eyebrow: "Active giveaways",
          headline: "Free games, easy to spot.",
          lede: "Browse current giveaways, see what’s new, and jump to the offer while it’s still active.",
          features: ["Live GamerPower feed", "Unseen-offer badge", "Local history"],
          query: ""
        },
        filters: {
          eyebrow: "Your feed, your way",
          headline: "Only the offers you care about.",
          lede: "Choose platforms and offer types once. Your feed and toolbar badge follow those preferences.",
          features: ["Platform filters", "Offer-type filters", "Saved locally"],
          query: ""
        },
        visited: {
          eyebrow: "Simple local tracking",
          headline: "Know what you’ve already checked.",
          lede: "Opened offers stop counting as new, while the complete matching feed stays within reach.",
          features: ["90-day local history", "No account", "No analytics"],
          query: "?visited"
        }
      };

      const modeName = new URLSearchParams(location.search).get("mode") || "feed";
      const mode = modes[modeName] || modes.feed;
      document.querySelector("#eyebrow").textContent = mode.eyebrow;
      document.querySelector("#headline").textContent = mode.headline;
      document.querySelector("#lede").textContent = mode.lede;
      document.querySelector("#features").replaceChildren(
        ...mode.features.map((text) => Object.assign(document.createElement("span"), { textContent: text }))
      );

      const popup = document.querySelector("#popup");
      popup.src = `/${mode.query}`;
      if (modeName === "filters") {
        popup.addEventListener("load", () => {
          popup.contentDocument.querySelector("#settings-button")?.click();
        });
      }
    </script>
  </body>
</html>
